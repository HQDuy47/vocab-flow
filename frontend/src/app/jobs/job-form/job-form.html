<section class="job-form-page">
  <div class="job-form-card">
    <h1>{{ isEditMode() ? 'Edit job' : 'Add new job' }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Company
        <input type="text" formControlName="company" />
        @if (
          form.controls.company.invalid && form.controls.company.touched
        ) {
          <span class="error">Company is required</span>
        }
      </label>

      <label>
        Position
        <input type="text" formControlName="position" />
        @if (
          form.controls.position.invalid && form.controls.position.touched
        ) {
          <span class="error">Position is required</span>
        }
      </label>

      <label>
        Status
        <select formControlName="status">
          @for (s of statuses; track s.value) {
            <option [value]="s.value">{{ s.label }}</option>
          }
        </select>
      </label>

      <label>
        Applied on
        <input type="date" formControlName="appliedDate" />
      </label>

      <label>
        Job posting link (optional)
        <input type="url" formControlName="link" placeholder="https://..." />
      </label>

      <label>
        Notes (optional)
        <textarea formControlName="notes" rows="3"></textarea>
      </label>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="cancel()">
          Cancel
        </button>
        <button type="submit" class="btn-primary">
          {{ isEditMode() ? 'Save' : 'Add' }}
        </button>
      </div>
    </form>
  </div>
</section>
